name: CI

on:
  push:
    branches: [main, MATSS-V2.0]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check townsim tests
      - name: Tests
        run: pytest -q
      - name: Determinism smoke (2 sim days, offline provider)
        run: python -m townsim run --days 2 --fast --provider fake --seed 42
