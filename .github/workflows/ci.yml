name: MATSS CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        # The matss core engine is stdlib-only, so only the test runner is needed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: Run test suite (with coverage)
        run: |
          python -m pytest --cov=matss --cov-report=term-missing -q

  determinism-gate:
    name: Reproducibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Assert bit-reproducible runs (seed -> identical state-hash chain)
        # The headline property: two independent runs of the same seed must
        # produce an identical per-tick state_hash chain. This job fails the
        # build if determinism ever regresses.
        run: |
          python -m pytest tests/test_integration_determinism.py -q
