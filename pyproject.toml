[project]
name = "townsim"
version = "2.0.0"
description = "Multi-Agent Town Story Simulator V2 — hybrid BT/utility agents with LLM narrative cognition"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
